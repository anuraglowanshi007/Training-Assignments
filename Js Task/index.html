<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compact Registration Form</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        padding: 15px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .form-wrapper {
        background: #fff;
        padding: 20px;
        width: 100%;
        max-width: 600px;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }

      .form-wrapper h3 {
        text-align: center;
        margin-bottom: 18px;
        color: #2c3e50;
        font-size: 24px;
        position: relative;
        padding-bottom: 10px;
      }

      .form-wrapper h3:after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 3px;
        background: linear-gradient(to right, #3498db, #2c3e50);
        border-radius: 2px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 14px;
        margin-bottom: 6px;
        font-weight: 600;
        color: #34495e;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        border: 1px solid #ddd;
        border-radius: 5px;
        transition: all 0.2s;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
      }

      .row {
        display: flex;
        gap: 15px;
        margin-bottom: 16px;
      }

      .row .form-group {
        flex: 1;
        margin-bottom: 0;
      }

      .radio-group {
        display: flex;
        gap: 15px;
        padding: 5px 0;
      }

      .radio-group label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: normal;
        cursor: pointer;
        font-size: 14px;
      }

      .radio-group input[type="radio"] {
        width: auto;
        margin: 0;
      }

      button {
        background: linear-gradient(to right, #3498db, #2c3e50);
        border: none;
        color: #fff;
        padding: 12px 20px;
        font-size: 15px;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        font-weight: 600;
        transition: all 0.2s;
        margin-top: 10px;
      }

      button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      .input-icon {
        position: relative;
      }

      .input-icon i {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #7f8c8d;
        font-size: 14px;
      }

      .input-icon input,
      .input-icon select {
        padding-left: 38px;
      }

      .form-section {
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #ecf0f1;
      }

      .form-section-title {
        font-size: 16px;
        color: #3498db;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .form-section-title i {
        font-size: 16px;
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        .row {
          flex-direction: column;
          gap: 0;
        }

        .row .form-group {
          margin-bottom: 16px;
        }

        .radio-group {
          flex-direction: column;
          gap: 8px;
        }

        .form-wrapper {
          padding: 18px 15px;
        }

        body {
          padding: 12px;
        }
      }

      @media (max-width: 480px) {
        .form-wrapper {
          padding: 15px 12px;
        }

        .form-wrapper h3 {
          font-size: 22px;
          margin-bottom: 15px;
        }

        input,
        select,
        textarea {
          padding: 9px 10px;
        }

        .form-section-title {
          font-size: 15px;
          margin-bottom: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="form-wrapper">
      <h3>Create Account</h3>
      <form>
        <div class="row">
          <div class="form-group">
            <label>First Name</label>
            <div class="input-icon">
              <i class="fas fa-user"></i>
              <input id="firstName" type="text" placeholder="First name" required />
            </div>
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <div class="input-icon">
              <i class="fas fa-user"></i>
              <input id="lastName" type="text" placeholder="Last name" required/>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input id="email" type="email" placeholder="email@example.com" required/>
          </div>
        </div>

        <div class="form-group">
          <label>Gender</label>
          <div class="radio-group">
            <label
              ><input type="radio" name="gender" value="Male" />
              <i class="fas fa-male"></i> Male</label
            >
            <label
              ><input type="radio" name="gender" value="Female" />
              <i class="fas fa-female"></i> Female</label
            >
            <label
              ><input type="radio" name="gender" value="Other" />
              <i class="fas fa-user"></i> Other</label
            >
          </div>
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <div class="input-icon">
            <i class="fas fa-mobile-alt"></i>
            <input id="mobile" type="text" placeholder="Mobile number" required/>
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label>Country</label>
            <div class="input-icon">
              <i class="fas fa-globe"></i>
              <select id="countrySelect" class="form-select">
                <option value="">Select Country</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>State</label>
            <div class="input-icon">
              <i class="fas fa-map-marker-alt"></i>
              <select id="stateSelect" class="form-select">
                <option value="">Select State</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>City</label>
          <div class="input-icon">
            <i class="fas fa-city"></i>
            <input id="city" type="text" placeholder="City"  required/>
          </div>
        </div>

        <div class="form-group">
          <label>Address</label>
          <div class="input-icon">
            <textarea id="address" rows="2" placeholder="Your full address"></textarea>
          </div>
        </div>

        <div class="form-group">
          <button type="submit">
            Submit <i class="fas fa-arrow-right"></i>
          </button>
        </div>
      </form>
      <div id="output" style="margin-top:20px; font-size:14px; color:#2c3e50;"></div>
    </div>

    <script>
      fetch("./location.json")
        .then((res) => res.json())
        .then((data) => {
          // Render countries
          const countrySelect = document.getElementById("countrySelect");
          console.log("data",data);
          data.countries.forEach((country) => {
            const option = document.createElement("option");  //create memory 
            option.value = country; 
            option.textContent = country;
            countrySelect.appendChild(option);  //select state
          });

          // Render states
          const stateSelect = document.getElementById("stateSelect");
          data.states.forEach((state) => {
            const option = document.createElement("option");
            option.value = state;
            option.textContent = state;
            stateSelect.appendChild(option);
          });
        })
        .catch(console.error);

      // FORM SUBMIT 
const form = document.querySelector("form");

form.addEventListener("submit", function (e) {
  e.preventDefault();  //stop page reload

  const firstName  = document.getElementById("firstName").value;
  const lastName   = document.getElementById("lastName").value;
  const email      = document.getElementById("email").value;
  const gender = document.querySelector('input[name="gender"]:checked')?.value;
  const mobile     = document.getElementById("mobile").value;
  const country    = document.getElementById("countrySelect").value;
  const state      = document.getElementById("stateSelect").value;
  const city       = document.getElementById("city").value;
  const address    = document.getElementById("address").value;

  //  print ouput result 
  const outputDiv = document.getElementById("output");
  outputDiv.innerHTML = `
    <strong>Submitted Data:</strong><br/>
    First Name: ${firstName}<br/>
    Last Name: ${lastName}<br/>
    Email: ${email}<br/>
    Gender: ${gender}<br/>
    Mobile: ${mobile}<br/>
    Country: ${country}<br/>
    State: ${state}<br/>
    City: ${city}<br/>
    Address: ${address}
  `;
});

    </script>
  </body>
</html>
